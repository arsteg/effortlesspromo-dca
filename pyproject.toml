[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "effortlesspromo-dca"
version = "0.1.0"
description = "EffortlessPromo Data Concierge Agent — per-tenant prospect data acquisition service"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "sqlalchemy==2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]
postgres = [
    "psycopg[binary]==3.2.3",
]

[project.scripts]
effortlesspromo-dca = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
