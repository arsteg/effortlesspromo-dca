# Alembic config for the DCA-owned database only.
#
# The database URL and the target schema are resolved at runtime from the DCA settings
# (EFFORTLESSPROMO_DCA_DATABASE_URL / EFFORTLESSPROMO_DCA_DB_SCHEMA) inside migrations/env.py — there
# is deliberately NO sqlalchemy.url here so a migration can never be pointed at another service's
# database by editing this file. migrations/env.py also guards against a host-owned schema.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
